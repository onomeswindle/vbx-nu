name: Update events from Resident Advisor

on:
  # Manual only. RA (DataDome) returns 403 to GitHub-hosted runners, so a daily
  # schedule only produced a failure mail every morning. Run it from the Actions
  # tab if you want to try; it writes vbx-site-repo/site/ra-events.jsx on success.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Fetch RA and regenerate events
        run: node scripts/update-from-ra.js
      - name: Commit changes if any
        run: |
          git config user.name "vbx-bot"
          git config user.email "bot@vbx.nu"
          if [ -n "$(git status --porcelain vbx-site-repo/site/ra-events.jsx)" ]; then
            git add vbx-site-repo/site/ra-events.jsx
            git commit -m "Auto-update events from RA"
            git push
          else
            echo "No event changes."
          fi
